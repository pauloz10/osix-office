name: Fedora packages

on:
  workflow_dispatch:
  push:
    branches: [main, fedora-main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  OSIX_TARGET: x86_64-unknown-linux-gnu

jobs:
  test-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  build-fedora-44:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install checkout prerequisites
        run: dnf -y install git tar gzip findutils

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Fedora build prerequisites
        run: >
          dnf -y install
          git gh curl wget file python3 python3-pip python3-pillow
          nodejs npm rust cargo gcc gcc-c++ make cmake ninja-build
          pkgconf-pkg-config webkit2gtk4.1-devel javascriptcoregtk4.1-devel
          openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          gtk3-devel glib2-devel libsoup3-devel rpm-build rpmdevtools
          patchelf desktop-file-utils libarchive unzip zip jq rsync bc
          java-25-openjdk-headless

      - name: Fetch pinned upstream
        run: ./scripts/02-fetch-base.sh

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work/euro-office-lite/src-tauri/target
          key: osix-fedora44-cargo-5c4e5fa-${{ hashFiles('work/euro-office-lite/src-tauri/Cargo.lock') }}
          restore-keys: |
            osix-fedora44-cargo-5c4e5fa-

      - name: Apply OsiX configuration
        run: ./scripts/03-customize.sh

      - name: Run OsiX tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build RPM and AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/04-build.sh

      - name: Collect packages
        run: ./scripts/06-collect-artifacts.sh

      - uses: actions/upload-artifact@v4
        with:
          name: osix-office-fedora-x86_64
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/*.AppImage

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: osix-office-fedora-build-logs
          if-no-files-found: ignore
          path: |
            /tmp/tauri-build.log
            /tmp/euro-office-lite/*.log
